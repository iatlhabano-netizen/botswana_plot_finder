name: botswana_plot_finder
description: Pathfinder — SADC Lo coordinate converter, plot finder, area calculator, and bush path guidance
publish_to: 'none'
version: 4.4.0+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.13.0
  google_maps_flutter: ^2.9.0
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  proj4dart: ^2.1.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.3
  share_plus: ^10.0.0
  shared_preferences: ^2.2.3
  flutter_compass: ^0.8.1
  flutter_cache_manager: ^3.4.2
  wakelock_plus: ^1.2.8
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_logo.png
    - assets/branding/app_logo_square.png
